# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    env:
      username: ${{secrets.USERNAME}} 
      password: ${{secrets.PASSWORD}}

      platform: aws
      region: us-east-1
      account: 123456789012

    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: "Mostrar mensaje"
        run: echo "Hola CLAUDIOS"

      - name: "Mostrando variables de entorno"
        if: ${{env.platform=='azure'}}
        run: |
          echo "Esto es el valor de platform: ${{ env.platform }}"
          echo "Esto es el valor de region: ${{ env.region }}"
          echo "esto es el valor de account: ${{ env.account }}"
      - name: "Mostrando variables SECRETS"
        run: |
          echo "Esto es el valor de username: ${{ env.username }}"
          echo "Esto es el valor de password: ${{ env.password }}"
      - name: "Mostrando variables por defecto"
        #if: ${{env.platform=='aws'}}
        run: |
          echo "Evento: ${{toJSON(github.event)}}"

        # Step 3: SSH into EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}        # EC2 server hostname/IP
          username: ${{ secrets.EC2_USERNAME }} # EC2 username
          script: |
            echo "Navigating to project directory..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "Pulling latest changes..."
            git pull origin master

            echo "Installing dependencies..."
            npm install

            echo "Checking if PM2 is already running the app..."
            if pm2 list | grep -q "index"; then
              echo "App already exists, restarting..."
              pm2 restart index
            else
              echo "App not found, starting first-time deploy..."
              pm2 start index.js --name index
            fi

            echo "Deployment complete!"