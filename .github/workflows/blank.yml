name: CI CI AWS 03   # Cambia el nombre para que coincida con la imagen (opcional)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    env:
      platform: aws
      region: us-east-1
      account: 123456789012
      # Los secretos se referencian directamente en los pasos, no es necesario ponerlos en env

    runs-on: ubuntu-latest

    steps:
      - name: Mostrar mensaje
        run: echo "Hola CLAUDIOS"

      # Este paso solo se ejecutará si platform es 'azure' (nunca ocurre con la configuración actual)
      - name: Mostrando variables de entorno (solo para Azure)
        if: env.platform == 'azure'
        run: |
          echo "Platform: ${{ env.platform }}"
          echo "Region: ${{ env.region }}"
          echo "Account: ${{ env.account }}"

      # ⚠️ ELIMINADO el paso que imprimía secretos – ¡NUNCA hagas eso!

      - name: Mostrando variables por defecto (evento)
        run: |
          echo "Evento: ${{ toJSON(github.event) }}"

      # Despliegue a EC2 usando la acción oficial de SSH
      - name: Deploy to EC2 en AWS
        uses: appleboy/ssh-action@v1.0.3   # <-- Aquí estaba el error principal
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}   # Añade este secreto (clave privada PEM)
          script: |
            set -e   # Salir ante cualquier error

            echo "Navigating to project directory..."
            cd ${{ secrets.PROJECT_PATH }}

            echo "Pulling latest changes from main..."
            git pull origin main   # Cambiado de 'master' a 'main'

            echo "Installing dependencies..."
            npm install

            echo "Restarting or starting app with PM2..."
            pm2 restart index || pm2 start index.js --name index

            echo "Deployment complete!"