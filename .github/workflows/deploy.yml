name: CI CI AWS 03

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Node.js app to EC2
    runs-on: ubuntu-latest

    env:
      platform: aws
      region: us-east-1
      account: 123456789012

    steps:
      # 1. Clonar el repositorio en el runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Verificar que los secretos necesarios existen
      - name: Verificar secretos requeridos
        run: |
          for secret in EC2_HOST EC2_USERNAME EC2_SSH_KEY PROJECT_PATH; do
            if [ -z "${!secret}" ]; then
              echo "❌ El secreto $secret no está definido"
              exit 1
            fi
          done
          echo "✅ Todos los secretos están definidos"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

      # 3. (Opcional) Mostrar variables de entorno (solo para AWS)
      - name: Mostrar variables de entorno
        if: env.platform == 'aws'
        run: |
          echo "Platform: ${{ env.platform }}"
          echo "Region: ${{ env.region }}"
          echo "Account: ${{ env.account }}"

      # 4. Desplegar usando SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=== Iniciando despliegue en EC2 ==="

            # Crear el directorio del proyecto si no existe
            mkdir -p ${{ secrets.PROJECT_PATH }}

            # Ir al directorio del proyecto
            cd ${{ secrets.PROJECT_PATH }}

            # Si no es un repositorio git, clonarlo o inicializarlo
            if [ ! -d ".git" ]; then
              echo "No hay repositorio git. Clonando..."
              git clone https://github.com/${{ github.repository }}.git .
            else
              echo "Repositorio git existente. Haciendo pull..."
              git pull origin main
            fi

            echo "Instalando dependencias..."
            npm install --production

            echo "Reiniciando aplicación con PM2..."
            pm2 restart index || pm2 start index.js --name index

            echo "=== Despliegue completado ==="

      # (Opcional) Paso adicional: notificar éxito o fallo
      - name: Notificar éxito
        if: success()
        run: echo "✅ Despliegue exitoso"